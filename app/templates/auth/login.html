{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-10 col-md-7 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Log in</h1>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="post" action="/login" novalidate>
          <input type="hidden" name="next" value="{{ next }}">
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" type="email" id="email" name="email" value="{{ email or '' }}" required autofocus autocomplete="email">
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password">
          </div>
          <button class="btn btn-eco w-100" type="submit">Log in</button>
        </form>
        <p class="small text-center mt-3 mb-0">No account? <a href="/register">Register</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

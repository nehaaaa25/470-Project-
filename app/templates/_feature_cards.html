{# Set only_allowed = true before including to hide features the current user cannot open. #}
<div class="row g-3">
  {% for f in FEATURES if not only_allowed or can_open(f, current_user) %}
    <div class="col-12 col-md-6 col-lg-4">
      <a class="card h-100 text-decoration-none feature-card" href="{{ f.url }}">
        <div class="card-body">
          <div class="d-flex align-items-center mb-2">
            <i class="bi bi-{{ f.icon }} fs-3 text-eco me-2"></i>
            <span class="badge text-bg-secondary">#{{ f.no }}</span>
          </div>
          <h3 class="h6 card-title text-body">{{ f.title }}</h3>
          <p class="card-text small text-body-secondary mb-1">{{ f.blurb }}</p>
          <p class="card-text small text-body-tertiary mb-0">Owner: {{ f.owner }}</p>
        </div>
      </a>
    </div>
  {% endfor %}
</div>
